<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Django Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        input, select, button {
            margin: 8px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #0078d7;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005bb5;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <h2>🧮 Django Calculator</h2>

        <input type="text" name="num1" placeholder="First Number" required>
        <select name="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
            <option value="**">^</option>
        </select>
        <input type="text" name="num2" placeholder="Second Number" required>

        <br>
        <button type="submit">Calculate</button>

        {% if result %}
            <h2>Result: {{ result }}</h2>
        {% endif %}
    </form>
</body>
</html>
